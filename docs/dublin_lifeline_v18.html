    function getIsoDate(offsetDays = 0) {
        const d = new Date();
        d.setDate(d.getDate() + offsetDays);
        return d.toISOString().split('T')[0];
    }

    function escapeHtml(v) {
        return String(v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[c]));
    }

    function haversine(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function formatDistance(km) {
        if (km < 0.5) return Math.round(km * 1000) + ' m';
        if (km < 10) return km.toFixed(1) + ' km';
        return Math.round(km) + ' km';
    }

    function getUserDistance(lat, lon) {
        if (userLat === null || userLon === null) return null;
        return haversine(userLat, userLon, lat, lon);
    }

    // ─── OPEN STATUS ─────────────────────────────────────────────────

    function getOpenStatus(schedule) {
        const now = new Date();
        const day = now.toLocaleDateString('en-IE', { weekday: 'long' });
        const minutes = now.getHours() * 60 + now.getMinutes();

        const windows = [];
        for (const [key, val] of Object.entries(schedule)) {
            const parts = val.split('–');
            if (parts.length < 2) continue;
            const daysPart = parts[0].trim();
            const timesPart = parts[1].trim();
            let days = [];
            if (daysPart.includes('–')) {
                const range = daysPart.split('–');
                const startDay = range[0].trim();
                const endDay = range[1].trim();
                const allDays = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
                let startIdx = allDays.indexOf(startDay);
                let endIdx = allDays.indexOf(endDay);
                if (startIdx === -1) { startIdx = 0; endIdx = 6; }
                if (endIdx === -1) endIdx = 6;
                for (let i = startIdx; i <= endIdx; i++) days.push(allDays[i]);
            } else if (daysPart === 'Daily') {
                days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
            } else if (daysPart === 'Mon–Fri') {
                days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
            } else if (daysPart === 'Mon–Sat') {
                days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            } else if (daysPart === 'Wed') {
                days = ['Wednesday'];
            } else if (daysPart === 'Fri') {
                days = ['Friday'];
            } else if (daysPart === 'Sat') {
                days = ['Saturday'];
            } else if (daysPart === 'Sun') {
                days = ['Sunday'];
            } else {
                if (daysPart.includes(day)) days = [day];
                else continue;
            }

            const timeMatch = timesPart.match(/(\d{1,2}):(\d{2})\s*–\s*(\d{1,2}):(\d{2})/);
            if (timeMatch) {
                const startMin = parseInt(timeMatch[1]) * 60 + parseInt(timeMatch[2]);
                const endMin = parseInt(timeMatch[3]) * 60 + parseInt(timeMatch[4]);
                for (const d of days) {
                    windows.push({ day: d, start: startMin, end: endMin });
                }
            }
        }

        for (const w of windows) {
            if (w.day === day && minutes >= w.start && minutes < w.end) {
                return { status: 'open', nextOpen: null };
            }
        }

        let nextOpen = null;
        const allDays = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
        const todayIdx = allDays.indexOf(day);
        for (let offset = 0; offset < 8; offset++) {
            const checkIdx = (todayIdx + offset) % 7;
            const checkDay = allDays[checkIdx];
            for (const w of windows) {
                if (w.day === checkDay) {
                    const openMin = w.start;
                    let openDate = new Date(now);
                    openDate.setDate(openDate.getDate() + offset);
                    openDate.setHours(0, 0, 0, 0);
                    openDate.setMinutes(openMin);
                    if (offset === 0 && openMin <= minutes) continue;
                    if (!nextOpen || openDate < nextOpen) {
                        nextOpen = openDate;
                    }
                }
            }
            if (nextOpen) break;
        }

        if (nextOpen) return { status: 'next', nextOpen };
        return { status: 'closed', nextOpen: null };
    }

    function formatNextOpen(date) {
        if (!date) return '';
        const h = date.getHours().toString().padStart(2, '0');
        const m = date.getMinutes().toString().padStart(2, '0');
        return h + ':' + m;
    }

    // ─── CALENDAR LINK ──────────────────────────────────────────────

    function getCalendarLink(title, date, time) {
        const start = new Date(date + 'T' + time + ':00');
        const end = new Date(start.getTime() + 60 * 60 * 1000);
        const startStr = start.toISOString().replace(/[-:]/g, '').split('.')[0];
        const endStr = end.toISOString().replace(/[-:]/g, '').split('.')[0];
        return `https://www.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${startStr}/${endStr}&details=Dublin+Essential+Service+appointment`;
    }

    function addToCalendar(title, date, time) {
        const url = getCalendarLink(title, date, time);
        window.open(url, '_blank');
    }

    // ─── GPS ──────────────────────────────────────────────────────────

    function requestGPS() {
        const status = document.getElementById("locationText");
        status.textContent = "📍 Acquiring GPS position...";

        if (!("geolocation" in navigator)) {
            status.textContent = "⚠️ Geolocation not supported on this browser.";
            return;
        }

        navigator.geolocation.getCurrentPosition(
            pos => {
                userLat = pos.coords.latitude;
                userLon = pos.coords.longitude;
                status.textContent = `📍 GPS Active (${userLat.toFixed(4)}, ${userLon.toFixed(4)})`;

                if (!map) {
                    initMap();
                }

                if (map) {
                    map.setView([userLat, userLon], 14);
                    if (userMarker) map.removeLayer(userMarker);

                    userMarker = L.circleMarker([userLat, userLon], {
                        radius: 8,
                        fillColor: "#005fcc",
                        color: "#ffffff",
                        weight: 3,
                        opacity: 1,
                        fillOpacity: 0.9
                    }).addTo(map).bindPopup("<strong>You are here</strong>").openPopup();
                }

                const items = appData.meal_and_dropin_services;
                const filtered = currentFilter === 'all' ? items : items.filter(s => s.tags.includes(currentFilter));
                renderCards(filtered);
            },
            err => {
                console.warn("GPS error:", err.message);
                status.textContent = "⚠️ GPS location denied or unavailable. Centered on Dublin.";
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
    }

            </div>
          `).join('');
            } else {
                html += `<div style="color:var(--muted);font-size:.88rem">No meal windows or appointments saved for today.</div>`;
            }
            html += `</div>`;
            container.innerHTML = html;
        } else if (currentGridFormat === 'week') {
            let html = `<div class="week-grid">`;
            for (let i = 0; i < 7; i++) {
                const dateStr = getIsoDate(i);
                const dayObj = new Date();
                dayObj.setDate(dayObj.getDate() + i);
                const dayName = dayObj.toLocaleDateString('en-IE', { weekday: 'short', month: 'numeric', day: 'numeric' });
                const events = userEvents.filter(e => e.date === dateStr);
                html += `<div class="day-box ${dateStr === todayStr ? 'today' : ''}">
            <h4><span>${dayName}</span> ${dateStr === todayStr ? '<b>TODAY</b>' : ''}</h4>
            ${events.map(e => `<div class="grid-event">
              <span><strong>${e.time}</strong> ${escapeHtml(e.title)}</span>
              <span class="cal-icon" onclick="addToCalendar('${escapeHtml(e.title)}', '${e.date}', '${e.time}')" title="${calText}">📅</span>
            </div>`).join('')}
          </div>`;
            }
            html += `</div>`;
            container.innerHTML = html;
        } else {
            let html = `<div class="month-grid">
          <div class="month-head">Mon</div><div class="month-head">Tue</div><div class="month-head">Wed</div>
          <div class="month-head">Thu</div><div class="month-head">Fri</div><div class="month-head">Sat</div><div class="month-head">Sun</div>`;
            for (let i = 0; i < 28; i++) {
                const dateStr = getIsoDate(i);
                const dayNum = dateStr.split('-')[2];
                const events = userEvents.filter(e => e.date === dateStr);
                html += `<div class="month-box ${dateStr === todayStr ? 'today' : ''}">
            <div class="month-number">${dayNum}</div>
            ${events.map(e => `<div class="grid-event" style="padding:2px;font-size:.62rem">
              ${e.time} ${escapeHtml(e.title)}
              <span class="cal-icon" onclick="addToCalendar('${escapeHtml(e.title)}', '${e.date}', '${e.time}')" style="font-size:.6rem;">📅</span>
            </div>`).join('')}
          </div>`;
            }
            html += `</div>`;
            container.innerHTML = html;
        }
    }

    function autoFillMealTime(val) {
        const customGroup = document.getElementById("customTitleGroup");
        if (val === "CUSTOM") {
            customGroup.style.display = "block";
        } else {
            customGroup.style.display = "none";
            if (val.includes("|")) document.getElementById("evtTime").value = val.split("|")[1];
        }
    }

    function openAddModal() {
        document.getElementById("evtDate").value = getIsoDate(0);
        document.getElementById("addModal").classList.add("active");
    }

    function closeAddModal() {
        document.getElementById("addModal").classList.remove("active");
    }

    function saveEvent() {
        const date = document.getElementById("evtDate").value;
        const rawType = document.getElementById("evtType").value;
        const time = document.getElementById("evtTime").value;
        let title = rawType === "CUSTOM" ?
            (document.getElementById("evtCustomTitle").value || "Appointment") :
            rawType.split("|")[0];
        if (!title) return;
        userEvents.push({ id: Date.now(), date, time, title });
        localStorage.setItem('dublin-guide-events', JSON.stringify(userEvents));
        closeAddModal();
        renderGridTimetable();
    }

    function deleteEvent(id) {
        userEvents = userEvents.filter(e => e.id !== id);
        localStorage.setItem('dublin-guide-events', JSON.stringify(userEvents));
        renderGridTimetable();
    }

    // ─── FILTER & RENDER CARDS ──────────────────────────────────────

    function filterServices(category, btn) {
        if (btn) {
            document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
            btn.classList.add("active");
        }
        currentFilter = category;
        const items = appData.meal_and_dropin_services;
        const filtered = category === 'all' ? items : items.filter(s => s.tags.includes(category));
        renderCards(filtered);
        updateMapMarkers(filtered);
    }

    function renderCards(items) {
        const navText = i18n[currentLang]?.navBtn || "🚶 Direct Nav";
        const callText = i18n[currentLang]?.callBtn || "📞 Contact";
        const openNowText = i18n[currentLang]?.openNow || "● Open Now";
        const opensAtText = i18n[currentLang]?.opensAt || "Opens at";
        const closedText = i18n[currentLang]?.closedToday || "Closed Today";

        const container = document.getElementById("cards");
        if (!items || items.length === 0) {
            container.innerHTML = `<div style="color:var(--muted);padding:20px;text-align:center;">No services match this filter.</div>`;
            return;
        }

        container.innerHTML = items.map(s => {
            const schedList = Object.entries(s.operating_schedule)
                .map(([k, v]) => `<li><strong>${k.toUpperCase().replace(/_/g, ' ')}:</strong> ${escapeHtml(v)}</li>`)
                .join('');

            const status = getOpenStatus(s.operating_schedule);
            let badgeHtml = '';
            if (status.status === 'open') {
                badgeHtml = `<span class="status-badge status-open">${openNowText}</span>`;
            } else if (status.status === 'next' && status.nextOpen) {
                const timeStr = formatNextOpen(status.nextOpen);
                badgeHtml = `<span class="status-badge status-next">${opensAtText} ${timeStr}</span>`;
            } else {
                badgeHtml = `<span class="status-badge status-closed">${closedText}</span>`;
            }

            const dist = getUserDistance(s.lat, s.lon);
            let distHtml = '';
            if (dist !== null) {
                distHtml = `<span class="distance-badge">📍 ${formatDistance(dist)}</span>`;
            }

            return `
          <article class="card">
            <h3>
              ${s.icon} ${escapeHtml(s.charity_name)}
              ${badgeHtml}
              ${distHtml}
            </h3>
            <div class="kind">📍 ${escapeHtml(s.location)}</div>
            <ul style="padding-left:18px;margin:8px 0;font-size:.85rem;color:var(--text);">${schedList}</ul>
            <div class="note">💡 ${escapeHtml(s.recommendations)}</div>
            <div class="actions">
              <a class="primary" href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lon}" target="_blank">${navText}</a>
              <a href="tel:${s.phone}">${callText}</a>
            </div>
          </article>
        `;
        }).join('');
    }

    // ─── MAP ──────────────────────────────────────────────────────────

    function updateMapMarkers(items) {
        if (!map || !markersGroup) return;
        markersGroup.clearLayers();
        items.forEach(s => {
            const customIcon = L.divIcon({
                className: 'custom-map-icon',
                html: s.icon,
                iconSize: [28, 28],
                iconAnchor: [14, 14]
            });
            const schedStr = Object.entries(s.operating_schedule)
                .map(([k, v]) => `<b>${k}:</b> ${v}`)
                .join('<br>');
            const m = L.marker([s.lat, s.lon], { icon: customIcon })
                .bindPopup(`<strong>${escapeHtml(s.charity_name)}</strong><br>${escapeHtml(s.location)}<br>${schedStr}`);
            markersGroup.addLayer(m);
        });
    }

    function initMap() {
        if (!window.L) {
            console.warn("Leaflet standard script not loaded; map cannot render.");
            return;
        }
        if (map) return;

        map = L.map("map").setView([DUBLIN.lat, DUBLIN.lon], 13);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { 
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        markersGroup = L.layerGroup().addTo(map);
        updateMapMarkers(appData.meal_and_dropin_services);

        setTimeout(() => {
            map.invalidateSize();
        }, 200);
    }

    // ─── GUIDE ────────────────────────────────────────────────────────

    function renderGuideMeals() {
        const container = document.getElementById("guideMealsContent");
        if (!container) return;
        let html = `<strong>Drop‑in Meal Centres:</strong><ul>`;
        appData.meal_and_dropin_services.forEach(item => {
            if (!item.tags.includes("library") && !item.tags.includes("shelter") && !item.tags.includes("advice")) {
                const hours = Object.values(item.operating_schedule).join(' | ');
                html += `<li><strong>${escapeHtml(item.charity_name)} (${escapeHtml(item.location)}):</strong> ${escapeHtml(hours)}</li>`;
            }
        });
        html += `</ul><strong>Emergency Grocery Parcels & Hampers:</strong><ul>`;
        appData.grocery_and_emergency_food_parcels.forEach(p => {
            const contact = p.contact ? ` (${p.contact})` : '';
            html += `<li><strong>${escapeHtml(p.provider_name)}${escapeHtml(contact)}:</strong> ${escapeHtml(p.schedule_and_access)} — <em>${escapeHtml(p.recommendations)}</em></li>`;
        });
        html += `</ul>`;
        container.innerHTML = html;
    }

    // ─── THEME ────────────────────────────────────────────────────────

    document.getElementById("themeBtn").onclick = () => {
        const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        document.getElementById("themeBtn").textContent = next === "dark" ? "☀ Light" : "☾ Dark";
    };

    // ─── INIT ────────────────────────────────────────────────────────

    document.addEventListener('DOMContentLoaded', function() {
        initMap();
        renderGuideMeals();
        renderCards(appData.meal_and_dropin_services);
        renderGridTimetable();

        window.showPage = showPage;
        window.filterServices = filterServices;
        window.requestGPS = requestGPS;
        window.toggleGridFormat = toggleGridFormat;
        window.autoFillMealTime = autoFillMealTime;
        window.openAddModal = openAddModal;
        window.closeAddModal = closeAddModal;
        window.saveEvent = saveEvent;
        window.deleteEvent = deleteEvent;
        window.changeLanguage = changeLanguage;
        window.addToCalendar = addToCalendar;
    });
</script>
